<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quizable — My Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      /* Light Neo-Brutalist "Print" Palette */
      --bg: #F4F2EC;
      --surface: #FFFFFF;
      --surface2: #EAE8E1;
      --border: #111111;
      
      --accent: #8b5cf6; 
      
      --green: #10b981;
      --red: #ef4444;
      --red-soft: #fee2e2;
      
      --text: #111111;
      --text-dim: #333333;
      --text-muted: #555555;
    }
    
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background-color: var(--bg);
      background-image: radial-gradient(#d5d3ce 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── NAV ── */
    nav { 
      position: sticky; top: 0; z-index: 100; 
      background: var(--bg); 
      border-bottom: 2px solid var(--border); 
      display: flex; align-items: center; padding: 0 2rem; height: 60px; gap: 1rem; 
    }
    .nav-logo { font-family: 'Space Grotesk', sans-serif; font-weight: 800; font-size: 1.2rem; text-transform: uppercase; text-decoration: none; color: var(--text); }
    .nav-logo span { color: var(--accent); }
    .nav-sep { color: var(--text-muted); font-size: 1.2rem; }
    .nav-page { font-size: 0.9rem; color: var(--text-dim); font-weight: 500; }
    .nav-spacer { flex: 1; }
    .btn-logout { 
      background: var(--surface); 
      border: 2px solid var(--border); 
      color: var(--text); 
      padding: 0.4rem 1rem; 
      cursor: pointer; 
      font-family: 'DM Mono', monospace; 
      font-size: 0.85rem; 
      font-weight: 700;
      text-transform: uppercase;
      box-shadow: 2px 2px 0 var(--border);
      transition: all 0.1s; 
    }
    .btn-logout:hover { 
      background: var(--red); 
      color: #fff; 
      box-shadow: 4px 4px 0 var(--border); 
      transform: translate(-2px, -2px); 
    }

    /* ── PROFILE HERO & LAYOUT ── */
    .page-wrapper { flex: 1; padding: 3rem 2rem 4rem; display: flex; justify-content: center; }
    .profile-container { width: 100%; max-width: 600px; }
    
    .back-crumb { display: inline-flex; align-items: center; gap: 0.4rem; color: var(--text-muted); font-size: 0.85rem; text-decoration: none; margin-bottom: 2rem; transition: color 0.1s; border-bottom: 1px dashed transparent; font-weight: 500; }
    .back-crumb:hover { color: var(--border); border-bottom-color: var(--border); }

    .profile-header { 
      display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2.5rem; 
      background: var(--surface);
      border: 2px solid var(--border);
      padding: 1.5rem;
      box-shadow: 6px 6px 0 var(--accent);
    }
    .avatar { 
      width: 80px; height: 80px; 
      background: var(--surface2); 
      border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center; 
      font-family: 'Space Grotesk', sans-serif; font-size: 2.5rem; font-weight: 800; color: var(--text); 
      box-shadow: 4px 4px 0 var(--border); 
    }
    .header-info { display: flex; flex-direction: column; align-items: flex-start; }
    .header-info h1 { font-family: 'Space Grotesk', sans-serif; font-size: 1.8rem; text-transform: uppercase; line-height: 1.1; margin-bottom: 0.3rem; }
    .header-info p { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 0.8rem; }
    
    /* ── STATUS BADGES ── */
    .status-badge { 
      display: inline-block; padding: 0.25rem 0.9rem; 
      font-family: 'DM Mono', monospace; font-size: 0.75rem; font-weight: 700; 
      text-transform: uppercase; letter-spacing: 0.05em; 
      border: 2px solid var(--border);
      box-shadow: 3px 3px 0 var(--border);
    }
    .status-free { background: var(--surface); color: var(--text); }
    .status-gold { background: #fcd34d; color: #111; }
    .status-platinum { background: #e5e7eb; color: #111; }

    /* ── EDIT FORM ── */
    .profile-card { 
      background: var(--surface); 
      border: 2px solid var(--border); 
      padding: 2.5rem; 
      position: relative;
    }
    
    .profile-card::before {
      content: ''; position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
      width: 80px; height: 20px; background: rgba(0,0,0,0.1);
      border: 1px dashed var(--text-muted);
    }

    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; color: var(--text); font-size: 0.85rem; margin-bottom: 0.5rem; font-weight: 700; text-transform: uppercase; }
    
    .form-control { 
      width: 100%; 
      background: var(--bg); 
      border: 2px solid var(--border); 
      color: var(--text); 
      padding: 0.8rem 1rem; 
      border-radius: 0; 
      font-family: 'DM Mono', monospace; 
      font-size: 1rem; 
      transition: all 0.15s; 
    }
    .form-control:focus { outline: none; box-shadow: 4px 4px 0 var(--accent); transform: translate(-2px, -2px); }
    .form-control:disabled { opacity: 0.6; cursor: not-allowed; background: var(--surface2); }
    
    .btn-save { 
      width: 100%; 
      background: var(--accent); 
      color: #fff; 
      border: 2px solid var(--border); 
      padding: 1rem; 
      border-radius: 0; 
      font-family: 'DM Mono', monospace; 
      font-size: 1rem; 
      font-weight: 700; 
      text-transform: uppercase;
      cursor: pointer; 
      transition: all 0.15s; 
      margin-top: 1rem; 
      box-shadow: 4px 4px 0 var(--border);
    }
    .btn-save:hover { background: #7c3aed; transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--border); }
    .btn-save:disabled { opacity: 0.7; cursor: not-allowed; transform: none; box-shadow: 4px 4px 0 var(--border); }

    #update-msg { 
      margin-top: 1.5rem; 
      padding: 1rem;
      text-align: center; 
      font-size: 0.9rem; 
      font-weight: 700; 
      display: none; 
      border: 2px solid var(--border);
      text-transform: uppercase;
    }
    .msg-success { background: #d1fae5; color: var(--green); box-shadow: 4px 4px 0 var(--green); }
    .msg-error { background: #fee2e2; color: var(--red); box-shadow: 4px 4px 0 var(--red); }

    /* ── DANGER ZONE ── */
    .danger-zone {
      margin-top: 3rem;
      background: var(--red-soft);
      border: 2px solid var(--red);
      padding: 2.5rem;
      position: relative;
    }
    .danger-zone::before {
      content: '⚠️ WARNING';
      position: absolute;
      top: -12px;
      left: 24px;
      background: var(--red);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 10px;
      border: 2px solid var(--border);
      text-transform: uppercase;
    }
    .danger-zone h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.4rem;
      color: var(--red);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }
    .danger-zone p {
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }
    .danger-zone .form-control {
      background: var(--surface);
      border-color: var(--red);
    }
    .danger-zone .form-control:focus {
      box-shadow: 4px 4px 0 var(--red);
    }
    .btn-danger {
      width: 100%; 
      background: var(--red); 
      color: #fff; 
      border: 2px solid var(--border); 
      padding: 1rem; 
      font-family: 'DM Mono', monospace; 
      font-size: 1rem; 
      font-weight: 700; 
      text-transform: uppercase;
      cursor: pointer; 
      transition: all 0.15s; 
      margin-top: 0.5rem; 
      box-shadow: 4px 4px 0 var(--border);
    }
    .btn-danger:hover { background: #dc2626; transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--border); }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="/"><span>Quizable</span></a>
  <span class="nav-sep">/</span>
  <span class="nav-page">Profile</span>
  <div class="nav-spacer"></div>
  <button class="btn-logout" onclick="logoutUser()">Log Out</button>
</nav>

<div class="page-wrapper">
  <div class="profile-container">
    
    <a href="/" class="back-crumb">← Back to dashboard</a>

    <div class="profile-header">
      <div class="avatar" id="user-avatar">?</div>
      <div class="header-info">
        <h1 id="display-name">Loading...</h1>
        <p id="display-email">fetching email...</p>
        <div id="premium-status" class="status-badge status-free">Free Tier</div>
      </div>
    </div>

    <div class="profile-card">
      <form id="profile-form" onsubmit="handleProfileUpdate(event)">
        
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="input-name" class="form-control" placeholder="Enter your full name" required>
        </div>

       <!-- <div class="form-group">
          <label>Phone Number (For UPI Verification)</label>
          <input type="tel" id="input-phone" class="form-control" placeholder="e.g., +91 9876543210">
        </div> -->

        <div class="form-group">
          <label>Target Exam</label>
          <select id="input-exam" class="form-control">
            <option value="none">Select an exam</option>
            <option value="jee-main">JEE Main</option>
            <option value="jee-adv">JEE Advanced</option>
            <option value="mht-cet">MHT CET</option>
            <option value="bitsat">BITSAT</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="input-email" class="form-control" disabled>
        </div>

        <button type="submit" class="btn-save" id="btn-save">Save Changes</button>
        <div id="update-msg"></div>
      </form>
    </div>

    <div class="danger-zone">
      <h2>Danger Zone</h2>
      <p>Deleting your account is a permanent action. All your test attempts, scores, and personal data will be completely erased from our servers.</p>
      
      <div class="form-group">
        <label style="color: var(--red);">Confirm Registered Email</label>
        <input type="email" id="delete-email" class="form-control" placeholder="Enter your email to confirm">
      </div>
      
      <div class="form-group">
        <label style="color: var(--red);">Reason for Deletion (Optional)</label>
        <input type="text" id="delete-reason" class="form-control" placeholder="Why are you leaving?">
      </div>

      <button class="btn-danger" onclick="requestAccountDeletion()">Request Account Deletion</button>
    </div>

  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, updateProfile, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
      apiKey: "AIzaSyBsMWa4Tup5nj6Xh5ev3FLiftGjWZGwukk",
    authDomain: "sigmascore300.firebaseapp.com",
    projectId: "sigmascore300",
    storageBucket: "sigmascore300.firebasestorage.app",
    messagingSenderId: "293195338803",
    appId: "1:293195338803:web:b2a45a3b48a378dd99ff46",
    measurementId: "G-MLZYWG2EEM"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUid = null;

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "/"; 
      return;
    }
    currentUid = user.uid;

    const name = user.displayName || "Aspirant";
    document.getElementById('display-name').textContent = name;
    document.getElementById('display-email').textContent = user.email;
    document.getElementById('input-name').value = user.displayName || "";
    document.getElementById('input-email').value = user.email;
    document.getElementById('user-avatar').textContent = name.charAt(0).toUpperCase();

    try {
      const userDoc = await getDoc(doc(db, "users", user.uid));
      if (userDoc.exists()) {
        const data = userDoc.data();
        
        if (data.phone) document.getElementById('input-phone').value = data.phone;
        if (data.targetExam) document.getElementById('input-exam').value = data.targetExam;

        const userPlan = data.plan || "free"; 
        const statusBadge = document.getElementById('premium-status');
        
        if (userPlan === "platinum") {
          statusBadge.textContent = "Platinum Member";
          statusBadge.className = "status-badge status-platinum";
        } else if (userPlan === "gold") {
          statusBadge.textContent = "Gold Member";
          statusBadge.className = "status-badge status-gold";
        } else {
          statusBadge.textContent = "Free Tier";
          statusBadge.className = "status-badge status-free";
        }
      }
    } catch (e) {
      console.error("Error fetching user data:", e);
    }
  });

  window.handleProfileUpdate = async function(event) {
    event.preventDefault();
    const btn = document.getElementById('btn-save');
    const msg = document.getElementById('update-msg');
    
    const newName = document.getElementById('input-name').value.trim();
    const newPhone = document.getElementById('input-phone').value.trim();
    const newExam = document.getElementById('input-exam').value;

    btn.disabled = true;
    btn.textContent = "Saving...";
    msg.style.display = "none";

    try {
      await updateProfile(auth.currentUser, { displayName: newName });
      await setDoc(doc(db, "users", currentUid), {
        name: newName,
        phone: newPhone,
        targetExam: newExam
      }, { merge: true });

      document.getElementById('display-name').textContent = newName;
      document.getElementById('user-avatar').textContent = newName.charAt(0).toUpperCase();

      msg.textContent = "Profile updated successfully!";
      msg.className = "msg-success";
      msg.style.display = "block";
    } catch (error) {
      msg.textContent = "Failed to update profile. Please try again.";
      msg.className = "msg-error";
      msg.style.display = "block";
    }

    btn.disabled = false;
    btn.textContent = "Save Changes";
  };

  // --- DANGER ZONE LOGIC ---
  window.requestAccountDeletion = function() {
    const emailField = document.getElementById('delete-email');
    const reasonField = document.getElementById('delete-reason');
    
    const email = emailField.value.trim();
    const reason = reasonField.value.trim() || 'No reason specified';

    if (!email) {
      alert("Please enter your registered email address to confirm deletion.");
      emailField.focus();
      return;
    }

    // Checking if it roughly matches the logged-in user's email if possible
    const currentEmail = document.getElementById('input-email').value;
    if (currentEmail && email.toLowerCase() !== currentEmail.toLowerCase()) {
      const confirmMismatch = confirm("The email entered does not match your currently logged-in email. Are you sure you want to proceed?");
      if (!confirmMismatch) return;
    }

    const supportEmail = "support@quizable.online";
    const subject = encodeURIComponent("Request for Account and Data Deletion");
    const body = encodeURIComponent(
      `Hello Quizable Support,\n\n` +
      `I would like to request the permanent deletion of my account and all associated data from your platform.\n\n` +
      `Here are my details:\n` +
      `Registered Email: ${email}\n` +
      `Reason for Deletion: ${reason}\n\n` +
      `Please confirm once the deletion process is complete.\n\n` +
      `Thank you.`
    );

    // Redirect to mail client
    window.location.href = `mailto:${supportEmail}?subject=${subject}&body=${body}`;
    
    // Clear fields after clicking
    emailField.value = '';
    reasonField.value = '';
  };

  window.logoutUser = function() {
    signOut(auth).then(() => { window.location.href = "/"; });
  };
</script>

</body>
</html>
