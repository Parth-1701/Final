<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Test Analytics · Quizable</title>
<style>
  :root{--bg:#0d1020;--panel:#151a2e;--panel2:#1b2138;--border:#272e4a;--text:#eef1ff;
        --muted:#8f97b8;--accent:#6c8cff;--green:#3ddc97;--red:#ff6b81}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);
        font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;
        border-bottom:1px solid var(--border);background:var(--panel)}
  .brand{font-weight:700;font-size:18px} .brand span{color:var(--muted);font-weight:500;margin-left:8px;font-size:13px}
  .chip{background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
  .wrap{max-width:1080px;margin:24px auto;padding:0 16px}
  .state{display:flex;flex-direction:column;align-items:center;gap:12px;padding:80px 0;color:var(--muted)}
  .spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .controls{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .field{display:flex;flex-direction:column;gap:6px} .field.grow{flex:1;min-width:220px}
  label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  select,input,button{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit}
  select:focus,input:focus{outline:2px solid var(--accent)}
  .btn{cursor:pointer;background:var(--accent);border-color:var(--accent);color:#08102a;font-weight:600}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px}
  .card .v{font-size:22px;font-weight:700} .card .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
  .panel h3{margin:0 0 12px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .chart{display:flex;gap:10px;align-items:flex-end;height:160px}
  .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
  .bar-fill{width:100%;max-width:56px;min-height:4px;background:linear-gradient(180deg,var(--accent),#4a6ae0);border-radius:8px 8px 2px 2px}
  .bar-label{font-size:11px;color:var(--muted)} .bar-count{font-size:11px;color:var(--muted)}
  .tablewrap{padding:0;overflow-x:auto} .tablewrap h3{padding:16px 16px 0}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  th.sortable{cursor:pointer;user-select:none} th.sortable:hover{color:var(--text)}
  tbody tr:hover{background:var(--panel2)}
  .num,th.num{text-align:right} .strong{font-weight:700} .muted{color:var(--muted)}
  .sname{font-weight:600} .semail{font-size:12px} #emptyMsg{padding:18px;text-align:center}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">Quizable <span>Admin · Test Analytics</span></div>
  <div id="userChip" class="chip"></div>
</header>

<main class="wrap">
  <div id="stateBox" class="state">
    <div class="spinner"></div>
    <p id="stateMsg">Checking permissions…</p>
  </div>

  <section id="dash" hidden>
    <div class="controls">
      <div class="field grow"><label for="testSelect">Test</label><select id="testSelect"></select></div>
      <div class="field grow"><label for="search">Search student</label><input id="search" type="search" placeholder="Name or email…"/></div>
      <div class="field"><label>&nbsp;</label><button id="exportBtn" class="btn">Export CSV</button></div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="panel"><h3>Score distribution</h3><div id="chart" class="chart"></div></div>

    <div class="panel tablewrap">
      <h3>Individual attempts</h3>
      <table>
        <thead><tr>
          <th>#</th><th>Student</th>
          <th class="num sortable" data-key="score">Score ⇅</th>
          <th class="num">Correct</th><th class="num">Wrong</th><th class="num">Accuracy</th>
          <th class="num sortable" data-key="timeTaken">Time ⇅</th>
          <th class="sortable" data-key="submittedAt">Submitted ⇅</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <p id="emptyMsg" class="muted" hidden>No attempts yet for this test.</p>
    </div>
  </section>
</main>

<script type="module">
// Use the same Firebase SDK version / config as your other pages.
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, query, where, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { /* paste your project's config here (same as other pages) */ };

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const USERS_COL = 'users', RESULTS_COL = 'results', TESTS_COL = 'tests';

const $ = id => document.getElementById(id);
const stateBox=$('stateBox'), stateMsg=$('stateMsg'), dash=$('dash'), userChip=$('userChip'),
      testSelect=$('testSelect'), search=$('search'), exportBtn=$('exportBtn'),
      stats=$('stats'), chart=$('chart'), tbody=$('tbody'), emptyMsg=$('emptyMsg');

const num  = v => Number(v) || 0;
const esc  = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const csvE = v => { v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };

function fmtTime(s){ s = Math.max(0, Math.round(num(s)));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return h ? `${h}h ${m}m ${sec}s` : m ? `${m}m ${sec}s` : `${sec}s`; }
function fmtDate(ts){ try { return ts?.toDate ? ts.toDate().toLocaleString() : ts ? new Date(ts).toLocaleString() : '—'; } catch { return '—'; } }

let usersMap = new Map(), testsList = [], allRows = [], unsub = null;
let sortKey = 'score', sortDir = -1, filterText = '';

/* ---------- ADMIN GATE (UX layer; real enforcement = Firestore rules below) ---------- */
onAuthStateChanged(auth, async user => {
  if (!user) return deny('Sign in with an admin account to view analytics.');
  let profile = null;
  try {
    const u = await getDoc(doc(db, USERS_COL, user.uid));
    if (u.exists()) profile = u.data();
  } catch (e) { console.error(e); }
  if ((profile?.role || '') !== 'admin') return deny('Access restricted: this page is visible only to admin accounts.');
  userChip.textContent = profile?.displayName || profile?.name || user.email || 'Admin';
  stateBox.hidden = true; dash.hidden = false;
  init();
});

function deny(msg){ const sp = stateBox.querySelector('.spinner'); if (sp) sp.remove(); stateMsg.textContent = msg; }

/* ---------- AUTO-FETCH TESTS + USERS ---------- */
async function init(){
  try {
    const uSnap = await getDocs(collection(db, USERS_COL));
    uSnap.forEach(d => { const x = d.data(); usersMap.set(d.id, { name: x.displayName || x.name || '', email: x.email || '' }); });
  } catch (e) { console.warn('users fetch failed', e); }

  testsList = await loadTests();
  if (!testsList.length) { dash.hidden = true; stateBox.hidden = false; stateMsg.textContent = 'No tests available for analysis yet.'; return; }

  testSelect.innerHTML = testsList.map(t => `<option value="${esc(t.id)}">${esc(t.title)}</option>`).join('');
  selectTest(testsList[0].id);
}

async function loadTests(){
  let list = [];
  try {
    const t = await getDocs(collection(db, TESTS_COL));
    t.forEach(d => { const x = d.data();
      list.push({ id: d.id, title: x.title || x.testTitle || x.name || x.testName || 'Untitled test' }); });
  } catch (e) { console.warn('tests fetch failed', e); }
  if (!list.length) { // fallback: derive test list from results
    const r = await getDocs(collection(db, RESULTS_COL));
    const seen = new Map();
    r.forEach(d => { const x = d.data();
      if (x.testId && !seen.has(x.testId)) seen.set(x.testId, x.testTitle || ('Test ' + x.testId.slice(0,6))); });
    list = [...seen.entries()].map(([id, title]) => ({ id, title }));
  }
  return list.sort((a,b) => a.title.localeCompare(b.title));
}

function selectTest(id){
  if (unsub) unsub();
  const q = query(collection(db, RESULTS_COL), where('testId', '==', id));
  unsub = onSnapshot(q, snap => {           // live: new submissions appear automatically
    allRows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderStats(); renderChart(); renderTable();
  }, err => {
    console.error(err);
    if (err.code === 'permission-denied') deny('Permission denied — update your Firestore security rules (see notes).');
  });
}

/* ---------- RENDER ---------- */
const card = (k,v) => `<div class="card"><div class="v">${v}</div><div class="k">${k}</div></div>`;

function renderStats(){
  const n = allRows.length;
  const scores = allRows.map(r => num(r.score));
  const times  = allRows.map(r => num(r.timeTaken));
  const sum = a => a.reduce((x,y) => x+y, 0);
  stats.innerHTML =
    card('Attempts', n) +
    card('Average score', n ? (sum(scores)/n).toFixed(1) : '—') +
    card('Highest', n ? Math.max(...scores) : '—') +
    card('Lowest',  n ? Math.min(...scores) : '—') +
    card('Avg time', n ? fmtTime(sum(times)/n) : '—');
}

function renderChart(){
  const scores = allRows.map(r => num(r.score));
  if (!scores.length) { chart.innerHTML = '<p class="muted">No data yet.</p>'; return; }
  const min = Math.min(...scores), max = Math.max(...scores), span = Math.max(1, max - min), B = 6;
  const counts = Array(B).fill(0);
  scores.forEach(s => { let i = Math.floor((s - min) / span * B); i = Math.min(B-1, Math.max(0, i)); counts[i]++; });
  const peak = Math.max(...counts, 1);
  chart.innerHTML = counts.map((c,i) => {
    const lo = Math.round(min + span*i/B), hi = Math.round(min + span*(i+1)/B);
    return `<div class="bar" title="${c} student(s) scored ${lo}–${hi}">
      <span class="bar-count">${c}</span>
      <div class="bar-fill" style="height:${Math.round(c/peak*110)}px"></div>
      <span class="bar-label">${lo}–${hi}</span></div>`;
  }).join('');
}

function prepareRows(){
  let rows = allRows.map(r => {
    const u = usersMap.get(r.userId) || {};
    return { ...r, _name: u.name || 'Unknown student', _email: u.email || '' };
  });
  if (filterText) rows = rows.filter(r => `${r._name} ${r._email}`.toLowerCase().includes(filterText));
  const val = r => sortKey === 'timeTaken' ? num(r.timeTaken)
                 : sortKey === 'submittedAt' ? (r.submittedAt?.toMillis?.() || 0)
                 : num(r.score);
  rows.sort((a,b) => { const va = val(a), vb = val(b); return va === vb ? 0 : (va < vb ? -1 : 1) * sortDir; });
  return rows;
}

function renderTable(){
  const rows = prepareRows();
  tbody.innerHTML = rows.map((r,i) => {
    const attempted = num(r.correct) + num(r.wrong);
    return `<tr>
      <td>${i+1}</td>
      <td><div class="sname">${esc(r._name)}</div><div class="semail muted">${esc(r._email)}</div></td>
      <td class="num strong">${num(r.score)}</td>
      <td class="num">${num(r.correct)}</td>
      <td class="num">${num(r.wrong)}</td>
      <td class="num">${attempted ? Math.round(num(r.correct)/attempted*100) + '%' : '—'}</td>
      <td class="num">${fmtTime(r.timeTaken)}</td>
      <td>${fmtDate(r.submittedAt)}</td>
    </tr>`;
  }).join('');
  emptyMsg.hidden = rows.length > 0;
}

/* ---------- EVENTS ---------- */
testSelect.addEventListener('change', e => selectTest(e.target.value));
search.addEventListener('input', e => { filterText = e.target.value.trim().toLowerCase(); renderTable(); });
document.querySelectorAll('th.sortable').forEach(th => th.addEventListener('click', () => {
  const k = th.dataset.key;
  if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = -1; }
  renderTable();
}));
exportBtn.addEventListener('click', () => {
  const rows = prepareRows();
  const head = ['Name','Email','Score','Correct','Wrong','Time taken (s)','Submitted at'];
  const lines = [head.join(',')].concat(rows.map(r =>
    [csvE(r._name), csvE(r._email), num(r.score), num(r.correct), num(r.wrong), num(r.timeTaken), csvE(fmtDate(r.submittedAt))].join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' }));
  a.download = 'quizable-analytics-' + (testSelect.selectedOptions[0]?.textContent || 'test').replace(/\s+/g,'-') + '.csv';
  a.click(); URL.revokeObjectURL(a.href);
});
</script>
</body>
</html>
