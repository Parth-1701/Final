<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quizable | Test Results</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Light Neo-Brutalist "Print" Palette */
      --bg: #F4F2EC;
      --surface: #FFFFFF;
      --surface2: #EAE8E1;
      --border: #111111;
      
      --accent: #8b5cf6; 
      
      --green: #10b981;
      --red: #ef4444;
      --yellow: #f59e0b;
      
      --text: #111111;
      --text-dim: #333333;
      --text-muted: #555555;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background-color: var(--bg);
      background-image: radial-gradient(#d5d3ce 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── NAV ── */
    nav { 
      position: sticky; top: 0; z-index: 100; 
      background: var(--bg); 
      border-bottom: 2px solid var(--border); 
      display: flex; align-items: center; padding: 0 2rem; height: 60px; gap: 1rem; 
    }
    .nav-logo { font-family: 'Space Grotesk', sans-serif; font-weight: 800; font-size: 1.2rem; text-transform: uppercase; text-decoration: none; color: var(--text); }
    .nav-logo span { color: var(--accent); }
    .nav-sep { color: var(--text-muted); font-size: 1.2rem; }
    .nav-page { font-size: 0.9rem; color: var(--text-dim); font-weight: 500; }
    .nav-spacer { flex: 1; }

    /* ── LAYOUT ── */
    .page-wrapper {
      max-width: 1000px;
      margin: 0 auto;
      padding: 3rem 2rem;
      width: 100%;
    }

    .header-section {
      text-align: center;
      margin-bottom: 3rem;
    }
    .header-section h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2rem, 5vw, 3rem);
      text-transform: uppercase;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 0.5rem;
    }
    .header-section p {
      font-size: 1rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    
    /* ── BRUTAL CARDS ── */
    .brutal-card {
      background: var(--surface);
      border: 2px solid var(--border);
      box-shadow: 6px 6px 0 var(--border);
      padding: 2rem;
      margin-bottom: 2rem;
    }

    /* ── RESULTS GRID ── */
    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 2rem;
      margin-bottom: 2rem;
    }
    @media (max-width: 768px) {
      .results-grid { grid-template-columns: 1fr; }
    }

    /* Left: Chart */
    .chart-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .chart-container {
      position: relative;
      width: 220px;
      height: 220px;
      margin-bottom: 1.5rem;
    }
    .chart-center {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    .score-main {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 3rem;
      font-weight: 800;
      line-height: 1;
      color: var(--text);
    }
    .score-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
      margin-top: 0.25rem;
    }

    /* Right: Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }
    .stat-item {
      background: var(--surface2);
      border: 2px solid var(--border);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .stat-value {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text);
    }
    
    .stat-item.correct { background: #d1fae5; }
    .stat-item.correct .stat-value { color: var(--green); }
    .stat-item.incorrect { background: #fee2e2; }
    .stat-item.incorrect .stat-value { color: var(--red); }
    
    /* ── ACTIONS ── */
    .action-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }
    .btn {
      flex: 1;
      text-align: center;
      background: var(--surface);
      color: var(--text);
      border: 2px solid var(--border);
      padding: 0.8rem 1.5rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--border);
      transition: all 0.1s;
    }
    .btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 var(--border);
    }
    .btn.primary {
      background: var(--accent);
      color: #fff;
    }
    .btn.primary:hover { box-shadow: 5px 5px 0 var(--border); background: #7c3aed; }

    /* ── LEADERBOARD ── */
    .leaderboard-header {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .leaderboard-table-wrapper {
      width: 100%;
      overflow-x: auto;
      border: 2px solid var(--border);
      background: var(--surface);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th, td {
      padding: 1rem;
      border-bottom: 2px solid var(--border);
      font-size: 0.9rem;
    }
    th {
      background: var(--surface2);
      font-weight: 700;
      text-transform: uppercase;
      border-right: 2px solid var(--border);
    }
    th:last-child { border-right: none; }
    td {
      border-right: 2px solid var(--border);
      font-weight: 500;
    }
    td:last-child { border-right: none; }
    tr:last-child td { border-bottom: none; }
    tr:hover { background: var(--bg); }

    .current-user-row td {
      background: rgba(139, 92, 246, 0.1);
      font-weight: 700;
    }

    .rank-badge {
      display: inline-block;
      width: 28px; height: 28px;
      line-height: 24px;
      text-align: center;
      border: 2px solid var(--border);
      border-radius: 50%;
      font-weight: 800;
      background: var(--surface);
    }
    .rank-1 { background: #fcd34d; color: #111; box-shadow: 2px 2px 0 var(--border); }
    .rank-2 { background: #e5e7eb; color: #111; box-shadow: 2px 2px 0 var(--border); }
    .rank-3 { background: #fdba74; color: #111; box-shadow: 2px 2px 0 var(--border); }

    .pro-tag {
      font-size: 0.65rem;
      background: #fcd34d;
      color: #111;
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 99px;
      font-weight: 800;
      text-transform: uppercase;
      margin-left: 0.5rem;
    }
  </style>
</head>
<body>
  <nav>
  <a class="nav-logo" href="/index.html"><span>Quizable</span></a>
  <span class="nav-sep">/</span>
  <span class="nav-page">Result</span>
  <div class="nav-spacer"></div>
  </nav>

<div class="page-wrapper">
  
  <div class="header-section">
    <h1>Test Complete</h1>
    <p id="test-title">Loading test details...</p>
  </div>

  <div class="results-grid">
    
    <div class="brutal-card chart-box">
      <div class="chart-container">
        <canvas id="scoreChart"></canvas>
        <div class="chart-center">
          <div class="score-main" id="score-display">0</div>
          <div class="score-sub">out of <span id="max-marks">0</span></div>
        </div>
      </div>
      <div class="action-row" style="width: 100%;">
        <button class="btn primary" onclick="reviewAnswers()">Review</button>
        <button class="btn" onclick="retakeTest()">Retake</button>
      </div>
      <div class="action-row" style="width: 100%; margin-top: 0.5rem;">
        <button class="btn" onclick="goHome()" style="background: var(--bg);">Back to Home</button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-item correct">
        <div class="stat-label">Correct</div>
        <div class="stat-value" id="correct-display">0</div>
      </div>
      <div class="stat-item incorrect">
        <div class="stat-label">Incorrect</div>
        <div class="stat-value" id="wrong-display">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Unattempted</div>
        <div class="stat-value" id="unattempted-val">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Accuracy</div>
        <div class="stat-value" id="accuracy-display">0%</div>
      </div>
      <div class="stat-item" style="grid-column: 1 / -1; display: flex; flex-direction: row; justify-content: space-between; align-items: center;">
        <div class="stat-label" style="margin: 0;">Time Taken</div>
        <div class="stat-value" id="time-display">00:00</div>
      </div>
    </div>

  </div>
  

  <div class="leaderboard-container">
    <div class="leaderboard-header">
        <h2>🏆 Top Scorers</h2>
        <p>Only your first attempt is ranked.</p>
    </div>
    <table class="leaderboard-table">
        <thead>
            <tr>
                <th>Rank</th>
                <th>Student</th>
                <th>Score</th>
            </tr>
        </thead>
        <tbody id="leaderboard-body">
            <tr><td colspan="3" style="text-align: center;">Loading rankings...</td></tr>
        </tbody>
    </table>
  </div>

  <script type="module">
    // Import Firestore if you are rendering the leaderboard on this page
    import { getFirestore, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

    // Initialize Firebase (Paste your config here again so the leaderboard works)
    const firebaseConfig = {
        apiKey: "AIzaSyBsMWa4Tup5nj6Xh5ev3FLiftGjWZGwukk",
        authDomain: "sigmascore300.firebaseapp.com",
        projectId: "sigmascore300",
        storageBucket: "sigmascore300.firebasestorage.app",
        messagingSenderId: "293195338803",
        appId: "1:293195338803:web:b2a45a3b48a378dd99ff46",
        measurementId: "G-MLZYWG2EEM"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.addEventListener("DOMContentLoaded", () => {
        // 1. Pull the data we temporarily saved in the browser during submit
        const resultData = sessionStorage.getItem('examResult');

        if (!resultData) {
            console.error("No test data found in session.");
            document.getElementById('score-display').innerText = "Error";
            return;
        }

        const data = JSON.parse(resultData);

        // 2. Calculate extra stats
        // Prevent dividing by zero if they skipped everything
        const totalAttempted = data.correct + data.wrong;
        const accuracy = totalAttempted > 0 ? ((data.correct / totalAttempted) * 100).toFixed(1) : 0;
        
        // Format seconds into MM:SS
        const minutes = Math.floor(data.timeTaken / 60);
        const seconds = data.timeTaken % 60;
        const formattedTime = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

        // 3. Inject into your HTML 
        document.getElementById('score-display').innerText = data.score;
        document.getElementById('correct-display').innerText = data.correct;
        document.getElementById('wrong-display').innerText = data.wrong;
        document.getElementById('accuracy-display').innerText = `${accuracy}%`;
        document.getElementById('time-display').innerText = formattedTime;

        // 4. Trigger the leaderboard render
        if(data.testId) {
            renderLeaderboard(data.testId);
        }
    });

    // 5. The Leaderboard Engine (from earlier)
    async function renderLeaderboard(testId) {
        const tbody = document.getElementById("leaderboard-body");
        if (!tbody) return; // Skip if you haven't added the leaderboard HTML yet

        try {
            const entriesRef = collection(db, "leaderboards", testId, "entries");
            const q = query(entriesRef, orderBy("score", "desc"), orderBy("timestamp", "asc"), limit(10));
            const querySnapshot = await getDocs(q);
            
            if (querySnapshot.empty) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align: center;">No attempts yet.</td></tr>`;
                return;
            }

            tbody.innerHTML = ""; 
            let rank = 1;

            querySnapshot.forEach((doc) => {
                const rowData = doc.data();
                let rowClass = rank === 1 ? "rank-1" : rank === 2 ? "rank-2" : rank === 3 ? "rank-3" : "";
                
                tbody.innerHTML += `
                    <tr class="${rowClass}">
                        <td>#${rank}</td>
                        <td>${rowData.userName}</td>
                        <td>${rowData.score}</td>
                    </tr>
                `;
                rank++;
            });
        } catch (error) {
            console.error("Failed to load leaderboard:", error);
            tbody.innerHTML = `<tr><td colspan="3" style="text-align: center;">Failed to load rankings.</td></tr>`;
        }
    }
  </script>
</body>
</html>
