<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quizable | Test Results</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
  <style>
  :root {
    /* Light Neo-Brutalist Palette */
    --bg: #F4F2EC;
    --surface: #FFFFFF;
    --surface2: #EAE8E1;
    --border: #111111;
    --accent: #8b5cf6; 
    --green: #10b981;
    --red: #ef4444;
    --text: #111111;
    --text-dim: #333333;
    --text-muted: #555555;
  }

  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
  }

  body { 
    background-color: var(--bg); 
    background-image: radial-gradient(#d5d3ce 1.5px, transparent 1.5px);
    background-size: 24px 24px;
    color: var(--text); 
    font-family: 'DM Mono', monospace; 
    min-height: 100vh; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    padding: 20px; 
  }

  h1, h2, h3, h4, h5, h6 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 800;
    text-transform: uppercase;
    color: var(--text);
  }

  /* Core Cards */
  .result-card { 
    background: var(--surface); 
    border: 2px solid var(--border); 
    border-radius: 0; 
    padding: 50px; 
    width: 100%;
    max-width: 800px;
    box-shadow: 6px 6px 0 var(--border);
    margin-bottom: 2rem;
  }

  /* Any internal stat boxes you used */
  .stat-box, .stat-item {
    background: var(--surface2);
    border: 2px solid var(--border);
    box-shadow: 3px 3px 0 var(--border);
    border-radius: 0;
    padding: 1.5rem;
    margin: 10px 0;
  }

  /* Leaderboard Styling */
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--surface);
    border: 2px solid var(--border);
    margin-top: 1.5rem;
    text-align: left;
  }

  th, td {
    padding: 1rem;
    border-bottom: 2px solid var(--border);
    border-right: 2px solid var(--border);
    font-family: 'DM Mono', monospace;
  }

  th {
    background: var(--surface2);
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
  }

  th:last-child, td:last-child {
    border-right: none;
  }

  tr:last-child td {
    border-bottom: none;
  }

  tr:hover {
    background: var(--bg);
  }

  /* Highlight Ranks based on your JS classes */
  .rank-1 td { background: #fcd34d; font-weight: bold; color: #111; }
  .rank-2 td { background: #e5e7eb; font-weight: bold; color: #111; }
  .rank-3 td { background: #fdba74; font-weight: bold; color: #111; }

  /* Buttons */
  button, .btn {
    background: var(--surface);
    color: var(--text);
    border: 2px solid var(--border);
    padding: 0.8rem 1.5rem;
    font-family: 'DM Mono', monospace;
    font-weight: 700;
    font-size: 0.9rem;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--border);
    transition: all 0.1s;
    border-radius: 0;
  }

  button:hover, .btn:hover {
    background: var(--accent);
    color: #fff;
    transform: translate(-2px, -2px);
    box-shadow: 5px 5px 0 var(--border);
  }

  /* Correct/Wrong color overrides if needed */
  .text-green { color: var(--green) !important; }
  .text-red { color: var(--red) !important; }
  </style>
</head>
<body>

  <div class="result-card">
    <div class="header-tag" id="exam-tag">Exam Completed</div>
    <h1>Your Score</h1>
    
    <div class="score-display" id="score-display">--</div>
    
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-value correct" id="correct-display">--</div>
        <div class="stat-label">Correct Answers</div>
      </div>
      <div class="stat-box">
        <div class="stat-value wrong" id="wrong-display">--</div>
        <div class="stat-label">Incorrect Answers</div>
      </div>
      <div class="stat-box">
        <div class="stat-value neutral" id="accuracy-display">--%</div>
        <div class="stat-label">Accuracy</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="time-display" style="color: white;">--:--</div>
        <div class="stat-label">Time Taken</div>
      </div>
    </div>

    <div style="display: flex; gap: 15px; width: 100%;">
      <button class="btn" style="background: var(--surface2); color: white; border: 1px solid var(--border);" onclick="window.location.href='index.html'">Dashboard</button>
      <button class="btn" onclick="window.location.href='analysis.html'">View Detailed Analysis →</button>
    </div>
  </div>

  <div class="leaderboard-container">
    <div class="leaderboard-header">
        <h2>🏆 Top Scorers</h2>
        <p>Only your first attempt is ranked.</p>
    </div>
    <table class="leaderboard-table">
        <thead>
            <tr>
                <th>Rank</th>
                <th>Student</th>
                <th>Score</th>
            </tr>
        </thead>
        <tbody id="leaderboard-body">
            <tr><td colspan="3" style="text-align: center;">Loading rankings...</td></tr>
        </tbody>
    </table>
  </div>

  <script type="module">
    // Import Firestore if you are rendering the leaderboard on this page
    import { getFirestore, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

    // Initialize Firebase (Paste your config here again so the leaderboard works)
    const firebaseConfig = {
        apiKey: "AIzaSyBsMWa4Tup5nj6Xh5ev3FLiftGjWZGwukk",
        authDomain: "sigmascore300.firebaseapp.com",
        projectId: "sigmascore300",
        storageBucket: "sigmascore300.firebasestorage.app",
        messagingSenderId: "293195338803",
        appId: "1:293195338803:web:b2a45a3b48a378dd99ff46",
        measurementId: "G-MLZYWG2EEM"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.addEventListener("DOMContentLoaded", () => {
        // 1. Pull the data we temporarily saved in the browser during submit
        const resultData = sessionStorage.getItem('examResult');

        if (!resultData) {
            console.error("No test data found in session.");
            document.getElementById('score-display').innerText = "Error";
            return;
        }

        const data = JSON.parse(resultData);

        // 2. Calculate extra stats
        // Prevent dividing by zero if they skipped everything
        const totalAttempted = data.correct + data.wrong;
        const accuracy = totalAttempted > 0 ? ((data.correct / totalAttempted) * 100).toFixed(1) : 0;
        
        // Format seconds into MM:SS
        const minutes = Math.floor(data.timeTaken / 60);
        const seconds = data.timeTaken % 60;
        const formattedTime = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

        // 3. Inject into your HTML 
        document.getElementById('score-display').innerText = data.score;
        document.getElementById('correct-display').innerText = data.correct;
        document.getElementById('wrong-display').innerText = data.wrong;
        document.getElementById('accuracy-display').innerText = `${accuracy}%`;
        document.getElementById('time-display').innerText = formattedTime;

        // 4. Trigger the leaderboard render
        if(data.testId) {
            renderLeaderboard(data.testId);
        }
    });

    // 5. The Leaderboard Engine (from earlier)
    async function renderLeaderboard(testId) {
        const tbody = document.getElementById("leaderboard-body");
        if (!tbody) return; // Skip if you haven't added the leaderboard HTML yet

        try {
            const entriesRef = collection(db, "leaderboards", testId, "entries");
            const q = query(entriesRef, orderBy("score", "desc"), orderBy("timestamp", "asc"), limit(10));
            const querySnapshot = await getDocs(q);
            
            if (querySnapshot.empty) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align: center;">No attempts yet.</td></tr>`;
                return;
            }

            tbody.innerHTML = ""; 
            let rank = 1;

            querySnapshot.forEach((doc) => {
                const rowData = doc.data();
                let rowClass = rank === 1 ? "rank-1" : rank === 2 ? "rank-2" : rank === 3 ? "rank-3" : "";
                
                tbody.innerHTML += `
                    <tr class="${rowClass}">
                        <td>#${rank}</td>
                        <td>${rowData.userName}</td>
                        <td>${rowData.score}</td>
                    </tr>
                `;
                rank++;
            });
        } catch (error) {
            console.error("Failed to load leaderboard:", error);
            tbody.innerHTML = `<tr><td colspan="3" style="text-align: center;">Failed to load rankings.</td></tr>`;
        }
    }
  </script>
</body>
</html>
