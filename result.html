<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quizable — Results</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      /* Light Neo-Brutalist "Print" Palette */
      --bg: #F4F2EC;
      --surface: #FFFFFF;
      --surface2: #EAE8E1;
      --border: #111111;
      
      --accent: #8b5cf6; 
      
      --green: #10b981;
      --red: #ef4444;
      --yellow: #f59e0b;
      
      --text: #111111;
      --text-dim: #333333;
      --text-muted: #555555;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background-color: var(--bg);
      background-image: radial-gradient(#d5d3ce 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── NAV ── */
    nav { 
      position: sticky; top: 0; z-index: 100; 
      background: var(--bg); 
      border-bottom: 2px solid var(--border); 
      display: flex; align-items: center; padding: 0 2rem; height: 60px; gap: 1rem; 
    }
    .nav-logo { font-family: 'Space Grotesk', sans-serif; font-weight: 800; font-size: 1.2rem; text-transform: uppercase; text-decoration: none; color: var(--text); }
    .nav-logo span { color: var(--accent); }
    .nav-sep { color: var(--text-muted); font-size: 1.2rem; }
    .nav-page { font-size: 0.9rem; color: var(--text-dim); font-weight: 500; }
    .nav-spacer { flex: 1; }

    /* ── LAYOUT ── */
    .page-wrapper {
      max-width: 1000px;
      margin: 0 auto;
      padding: 3rem 2rem;
      width: 100%;
    }

    .header-section {
      text-align: center;
      margin-bottom: 3rem;
    }
    .header-section h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2rem, 5vw, 3rem);
      text-transform: uppercase;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 0.5rem;
    }
    .header-section p {
      font-size: 1rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    /* ── BRUTAL CARDS ── */
    .brutal-card {
      background: var(--surface);
      border: 2px solid var(--border);
      box-shadow: 6px 6px 0 var(--border);
      padding: 2rem;
      margin-bottom: 2rem;
    }

    /* ── RESULTS GRID ── */
    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 2rem;
      margin-bottom: 2rem;
    }
    @media (max-width: 768px) {
      .results-grid { grid-template-columns: 1fr; }
    }

    /* Left: Chart */
    .chart-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .chart-container {
      position: relative;
      width: 220px;
      height: 220px;
      margin-bottom: 1.5rem;
    }
    .chart-center {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    .score-main {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 3rem;
      font-weight: 800;
      line-height: 1;
      color: var(--text);
    }
    .score-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
      margin-top: 0.25rem;
    }

    /* Right: Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }
    .stat-item {
      background: var(--surface2);
      border: 2px solid var(--border);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .stat-value {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text);
    }
    
    .stat-item.correct { background: #d1fae5; }
    .stat-item.correct .stat-value { color: var(--green); }
    .stat-item.incorrect { background: #fee2e2; }
    .stat-item.incorrect .stat-value { color: var(--red); }
    
    /* ── ACTIONS ── */
    .action-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }
    .btn {
      flex: 1;
      text-align: center;
      background: var(--surface);
      color: var(--text);
      border: 2px solid var(--border);
      padding: 0.8rem 1.5rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--border);
      transition: all 0.1s;
    }
    .btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 var(--border);
    }
    .btn.primary {
      background: var(--accent);
      color: #fff;
    }
    .btn.primary:hover { box-shadow: 5px 5px 0 var(--border); background: #7c3aed; }

    /* ── LEADERBOARD ── */
    .leaderboard-header {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .leaderboard-table-wrapper {
      width: 100%;
      overflow-x: auto;
      border: 2px solid var(--border);
      background: var(--surface);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th, td {
      padding: 1rem;
      border-bottom: 2px solid var(--border);
      font-size: 0.9rem;
    }
    th {
      background: var(--surface2);
      font-weight: 700;
      text-transform: uppercase;
      border-right: 2px solid var(--border);
    }
    th:last-child { border-right: none; }
    td {
      border-right: 2px solid var(--border);
      font-weight: 500;
    }
    td:last-child { border-right: none; }
    tr:last-child td { border-bottom: none; }
    tr:hover { background: var(--bg); }

    .current-user-row td {
      background: rgba(139, 92, 246, 0.1);
      font-weight: 700;
    }

    .rank-badge {
      display: inline-block;
      width: 28px; height: 28px;
      line-height: 24px;
      text-align: center;
      border: 2px solid var(--border);
      border-radius: 50%;
      font-weight: 800;
      background: var(--surface);
    }
    .rank-1 { background: #fcd34d; color: #111; box-shadow: 2px 2px 0 var(--border); }
    .rank-2 { background: #e5e7eb; color: #111; box-shadow: 2px 2px 0 var(--border); }
    .rank-3 { background: #fdba74; color: #111; box-shadow: 2px 2px 0 var(--border); }

    .pro-tag {
      font-size: 0.65rem;
      background: #fcd34d;
      color: #111;
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 99px;
      font-weight: 800;
      text-transform: uppercase;
      margin-left: 0.5rem;
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="/index.html"><span>Quizable</span></a>
  <span class="nav-sep">/</span>
  <span class="nav-page">Result</span>
  <div class="nav-spacer"></div>
</nav>

<div class="page-wrapper">
  
  <div class="header-section">
    <h1>Test Complete</h1>
    <p id="test-title">Loading test details...</p>
  </div>

  <div class="results-grid">
    
    <div class="brutal-card chart-box">
      <div class="chart-container">
        <canvas id="scoreChart"></canvas>
        <div class="chart-center">
          <div class="score-main" id="score-val">0</div>
          <div class="score-sub">out of <span id="max-marks">0</span></div>
        </div>
      </div>
      <div class="action-row" style="width: 100%;">
        <button class="btn primary" onclick="reviewAnswers()">Review</button>
        <button class="btn" onclick="retakeTest()">Retake</button>
      </div>
      <div class="action-row" style="width: 100%; margin-top: 0.5rem;">
        <button class="btn" onclick="goHome()" style="background: var(--bg);">Back to Home</button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-item correct">
        <div class="stat-label">Correct</div>
        <div class="stat-value" id="correct-display">0</div>
      </div>
      <div class="stat-item incorrect">
        <div class="stat-label">Incorrect</div>
        <div class="stat-value" id="wrong-display">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Time Taken</div>
        <div class="stat-value" id="time-display">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Accuracy</div>
        <div class="stat-value" id="accuracy-display">0%</div>
      </div>
  <!--    <div class="stat-item" style="grid-column: 1 / -1; display: flex; flex-direction: row; justify-content: space-between; align-items: center;">
        <div class="stat-label" style="margin: 0;">Time Taken</div>
        <div class="stat-value" id="time-val">00:00</div>
      </div> -->
    </div>

  </div>

  <div class="brutal-card">
    <div class="leaderboard-header">
      🏆 Leaderboard (First Attempts)
    </div>
    <div class="leaderboard-table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Name</th>
            <th>Score</th>
            <th>Time Taken</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body">
          <tr><td colspan="4" style="text-align: center;">Loading leaderboard...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, collection, query, where, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
      apiKey: "AIzaSyBsMWa4Tup5nj6Xh5ev3FLiftGjWZGwukk",
      authDomain: "sigmascore300.firebaseapp.com",
      projectId: "sigmascore300",
      storageBucket: "sigmascore300.firebasestorage.app",
      messagingSenderId: "293195338803",
      appId: "1:293195338803:web:b2a45a3b48a378dd99ff46",
      measurementId: "G-MLZYWG2EEM"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const urlParams = new URLSearchParams(window.location.search);
  const testId = urlParams.get('testId');
  const resultId = urlParams.get('resultId');

  let currentUserId = null;
  let testData = null;
  let resultData = null;

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "/";
      return;
    }
    currentUserId = user.uid;
    loadResultData();
  });

  async function loadResultData() {
    try {
      const resDoc = await getDoc(doc(db, "results", resultId));
      if (!resDoc.exists()) {
        alert("Result not found.");
        return;
      }
      resultData = resDoc.data();

      if (resultData.userId !== currentUserId) {
        alert("Unauthorized access.");
        window.location.href = "/";
        return;
      }

      const testDoc = await getDoc(doc(db, "tests", testId));
      if (testDoc.exists()) {
        testData = testDoc.data();
        document.getElementById('test-title').textContent = testData.title;
        document.getElementById('max-marks').textContent = testData.totalMarks || 300;
      }

      populateUI();
      loadLeaderboard();
    } catch (e) {
      console.error("Error loading result:", e);
    }
  }

  function populateUI() {
    document.getElementById('score-val').textContent = resultData.score;
    
    let totalQs = resultData.stats.totalQuestions;
    let correct = resultData.stats.correct;
    let incorrect = resultData.stats.incorrect;
    let unattempted = resultData.stats.unattempted;

    document.getElementById('correct-display').textContent = correct;
    document.getElementById('wrong-display').textContent = incorrect;
    document.getElementById('unattempted-val').textContent = unattempted;

    let accuracy = 0;
    if ((correct + incorrect) > 0) {
      accuracy = Math.round((correct / (correct + incorrect)) * 100);
    }
    document.getElementById('accuracy-display').textContent = `${accuracy}%`;

    let timeUsed = resultData.timeSpent || 0;
    let mins = Math.floor(timeUsed / 60);
    let secs = timeUsed % 60;
    document.getElementById('time-display').textContent = 
      `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

    // Initialize Chart.js with Brutalist styling
    const ctx = document.getElementById('scoreChart').getContext('2d');
    new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['Correct', 'Incorrect', 'Unattempted'],
        datasets: [{
          data: [correct, incorrect, unattempted],
          backgroundColor: ['#10b981', '#ef4444', '#EAE8E1'],
          borderColor: '#111111',
          borderWidth: 2,
          hoverOffset: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '75%',
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#111111',
            titleFont: { family: 'DM Mono', size: 12 },
            bodyFont: { family: 'DM Mono', size: 12 },
            padding: 10,
            cornerRadius: 0
          }
        }
      }
    });
  }

  async function loadLeaderboard() {
    try {
      const q = query(
        collection(db, "results"),
        where("testId", "==", testId),
        where("metadata.isFirstAttempt", "==", true),
        orderBy("score", "desc"),
        orderBy("timeSpent", "asc"),
        limit(20)
      );

      const querySnapshot = await getDocs(q);
      const tbody = document.getElementById('leaderboard-body');
      tbody.innerHTML = '';

      if (querySnapshot.empty) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">No first attempts recorded yet.</td></tr>`;
        return;
      }

      let rank = 1;
      for (const docSnap of querySnapshot.docs) {
        const rowData = docSnap.data();
        
        let rankHtml = `<span class="rank-badge">${rank}</span>`;
        if (rank === 1) rankHtml = `<span class="rank-badge rank-1">1</span>`;
        if (rank === 2) rankHtml = `<span class="rank-badge rank-2">2</span>`;
        if (rank === 3) rankHtml = `<span class="rank-badge rank-3">3</span>`;

        let timeStr = "--:--";
        if (rowData.timeSpent) {
          let m = Math.floor(rowData.timeSpent / 60);
          let s = rowData.timeSpent % 60;
          timeStr = `${m.toString().padStart(2, '0')}m ${s.toString().padStart(2, '0')}s`;
        }

        const isMe = (rowData.userId === currentUserId);
        
        // Fetch user plan for PRO tag
        let proTag = "";
        try {
            const uDoc = await getDoc(doc(db, "users", rowData.userId));
            if(uDoc.exists() && uDoc.data().plan === "platinum") {
                proTag = `<span class="pro-tag">Pro</span>`;
            }
        } catch(e) {}

        const tr = document.createElement('tr');
        if (isMe) tr.className = 'current-user-row';

        tr.innerHTML = `
          <td>${rankHtml}</td>
          <td>${rowData.userName || 'Anonymous'} ${isMe ? '(You)' : ''} ${proTag}</td>
          <td><strong>${rowData.score}</strong></td>
          <td>${timeStr}</td>
        `;
        tbody.appendChild(tr);
        rank++;
      }
    } catch (e) {
      console.error("Leaderboard error:", e);
      document.getElementById('leaderboard-body').innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--red);">Error loading leaderboard.</td></tr>`;
    }
  }

  window.reviewAnswers = function() {
    window.location.href = `/review.html?testId=${testId}&resultId=${resultId}`;
  };

  window.retakeTest = function() {
    window.location.href = `/test.html?testId=${testId}&title=${encodeURIComponent(testData?.title || 'Retake Test')}`;
  };

  window.goHome = function() {
    window.location.href = "/";
  };
</script>

</body>
</html>
