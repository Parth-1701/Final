<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Question Not Found | Quizable</title>
    
    <!-- Space Grotesk fits this style perfectly -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Neo-Brutalist "Print" Palette */
            --bg: #F4F2EC;         /* Warm, organic paper off-white */
            --surface: #FFFFFF;    /* Pure white for the card */
            --text-main: #000000;  /* Harsh, unapologetic black */
            --text-muted: #555555; /* Ink grey */
            --border-color: #000000; /* Solid black borders */
            
            --accent: #FF4500;     /* Vibrant, non-glowing flat orange-red */
            --accent-hover: #E03E00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            
            /* Subtle dot grid to look like a notebook */
            background-image: radial-gradient(#d1cdbe 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }

        .quiz-card {
            max-width: 600px;
            width: 100%;
            background-color: var(--surface);
            border: 3px solid var(--border-color);
            border-radius: 12px;
            padding: 3rem;
            /* Hard offset shadow - the signature of this design style */
            box-shadow: 8px 8px 0px rgba(0, 0, 0, 1);
        }

        .question-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .points {
            background: var(--surface);
            padding: 0.25rem 0.75rem;
            border-radius: 99px;
            border: 2px solid var(--border-color);
            box-shadow: 2px 2px 0px rgba(0, 0, 0, 1);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 2.5rem;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        /* Styling the fake "wrong" options */
        .option {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            padding: 1.25rem;
            background-color: var(--surface);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-weight: 600;
            transition: all 0.2s ease;
            cursor: default;
            box-shadow: 3px 3px 0px rgba(0,0,0,1);
        }

        .option:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px rgba(0,0,0,1);
        }

        .option-letter {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 4px;
            background-color: var(--bg);
            border: 2px solid var(--border-color);
            font-weight: 700;
            font-size: 1rem;
        }

        /* Styling the "Correct" option which acts as the real button */
        .option-correct {
            text-decoration: none;
            background-color: var(--accent);
            color: #ffffff;
            cursor: pointer;
        }

        .option-correct .option-letter {
            background-color: #ffffff;
            color: var(--accent);
            border-color: #ffffff;
        }

        .option-correct:hover {
            background-color: var(--accent-hover);
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px rgba(0,0,0,1);
        }

        @media (max-width: 600px) {
            .quiz-card {
                padding: 2rem;
                box-shadow: 4px 4px 0px rgba(0, 0, 0, 1);
            }
            .option {
                box-shadow: 2px 2px 0px rgba(0,0,0,1);
            }
            .option:hover, .option-correct:hover {
                box-shadow: 4px 4px 0px rgba(0,0,0,1);
            }
            h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <div class="quiz-card">
        <div class="question-meta">
            <span>Q. 404</span>
            <span class="points">-0 Marks</span>
        </div>
        
        <h1>The page you are looking for does not exist. What is the most logical next step?</h1>
        
        <div class="options-list">
            <div class="option">
                <span class="option-letter">A</span>
                <span>Stare blankly at the screen.</span>
            </div>
            
            <div class="option">
                <span class="option-letter">B</span>
                <span>Complain that it was out of syllabus.</span>
            </div>
            
            <div class="option">
                <span class="option-letter">C</span>
                <span>Refresh the page 50 times in denial.</span>
            </div>
            
            <!-- This option is the actual hyperlink back to your app -->
            <a href="/index.html" class="option option-correct">
                <span class="option-letter">D</span>
                <span>Click here to return to the Homepage.</span>
            </a>
        </div>
    </div>

</body>
</html>
